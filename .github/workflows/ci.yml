name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Format
        run: dart format --output=none --set-exit-if-changed $(git ls-files 'lib/*.dart' 'test/*.dart' | grep -v '\.g\.dart$')
      - run: flutter analyze
      # 跑全部测试并统计覆盖率：口径见脚本注释（纳入没被测试 import 的文件，排除生成代码）
      - name: Test + coverage
        run: tool/coverage.sh
        env:
          MIN_COVERAGE: '85'
      - name: Coverage summary
        if: always()
        run: |
          echo '### App 覆盖率' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat coverage/summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-coverage
          path: app/coverage/lcov.filtered.info

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run typecheck
      # 门槛在 package.json 的 jest.coverageThreshold，低于门槛时 jest 以非零退出
      - name: Test + coverage
        shell: bash
        run: npm run test:cov 2>&1 | tee coverage.log
      - name: Coverage summary
        if: always()
        run: |
          echo '### Server 覆盖率' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sed -n '/Coverage summary/,/^Lines/p' coverage.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build

  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 客户端内置模板与服务端模板一致
        run: diff app/assets/prompt_templates.json server/src/templates/prompt-templates.json
