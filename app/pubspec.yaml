name: jingtouben
description: AI 短剧镜头本 —— 把一个故事整理成可以直接拿去生成的镜头。
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  bloc_concurrency: ^0.3.0
  drift: ^2.28.0
  drift_flutter: ^0.2.7
  equatable: ^2.0.7
  fetch_client: ^1.1.4
  flutter_bloc: ^9.1.1
  go_router: ^16.3.0
  http: ^1.5.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.5.0
  drift_dev: ^2.28.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/prompt_templates.json
